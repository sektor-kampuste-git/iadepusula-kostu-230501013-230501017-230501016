name: Üye 1 doğrulama

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src eval scripts tests
      - run: python -m ruff format --check src eval scripts tests
      - run: python scripts/check_secrets.py
      - run: python -m pytest -q
      - run: python -m eval.eval_kosucu --min-pass-rate 0.85 --output artifacts/eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval-python-${{ matrix.python-version }}
          path: artifacts/eval.json
