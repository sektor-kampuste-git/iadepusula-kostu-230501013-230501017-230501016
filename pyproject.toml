[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "iadepusula"
version = "0.3.2"
description = "Kaynaklı Türkçe ön inceleme: RAG, sınırlı ajan, doğrulama ve maliyet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "rank-bm25>=0.2.2,<0.3",
  "qdrant-client>=1.15,<2",
  "holidays>=0.80,<1",
  "Faker>=37,<41",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
mcp = ["mcp>=1.20,<2"]

[project.scripts]
iadepusula = "src.cli:main"
iadepusula-maliyet = "maliyet_hesapla:main"

[tool.setuptools]
packages = ["src", "eval", "iadepusula_data"]
py-modules = ["maliyet_hesapla"]

[tool.setuptools.package-dir]
iadepusula_data = "data"

[tool.setuptools.package-data]
iadepusula_data = ["*.json", "mevzuat_derlemi/*.json"]
eval = ["evaller.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
